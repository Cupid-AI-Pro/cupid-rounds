<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F7"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF2D55" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Icon Background Badge (App Icon Standard) -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FFE4E9" stroke-width="8"/>
  
  <!-- Cupid Monogram (Intertwined C + Heart) -->
  <g transform="translate(64, 64) scale(12)" filter="url(#shadow)">
    <!-- Outer Architectural C Curve -->
    <path
      d="M23 8C20.5 5.5 16.5 4.5 12.5 6C7.5 7.8 4 12.6 4 18C4 23.8 8.2 28.5 14 28.5C18.5 28.5 22 26 24 22.5"
      stroke="url(#heartGrad)"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Delicate Inner Heart Apex -->
    <path
      d="M17 11.5C17 11.5 19.5 9 22 10.5C24.5 12 24.5 15.5 21.5 18.5L17 23L12.5 18.5C9.5 15.5 9.5 12 12 10.5C14.5 9 17 11.5 17 11.5Z"
      fill="url(#heartGrad)"
    />
  </g>
</svg>